name: e10_sat18_supervised_family
command: train
scenario: data/SAT18-EXP
args:
  portfolio: true
  mode: supervised
  split: family
  max_clauses: 20000
  require_cnf: true
  dim: 32
  rounds: 3
  epochs: 40
  patience: 10
  out: experiments/e10_training/results/sat18_supervised_family.csv
  report: experiments/e10_training/results/sat18_supervised_family.json
  graph_stats: data/graph_stats_SAT18-EXP.csv
