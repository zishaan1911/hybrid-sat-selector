[project]
name = "hsat"
version = "0.1.0"
description = "Hybrid handcrafted-feature + GNN framework for per-instance SAT solver selection"
authors = [{ name = "Zishaan Ahmed", email = "iamzishaan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Meta-classifier and plotting: needed from E5/E6 onward.
ml = ["xgboost>=2.0", "matplotlib>=3.8"]
# Graph branch. torch/PyG wheels are platform-specific; see docs/PLAN.md section 5.
# CPU:  uv pip install torch --index-url https://download.pytorch.org/whl/cpu
# CUDA: uv pip install torch --index-url https://download.pytorch.org/whl/cu124
graph = ["torch>=2.2", "torch-geometric>=2.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hsat = "hsat.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
